<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ Employee Registration Portal ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4F46E5,#06B6D4,#3B82F6);
}

.container{

    width:430px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.2);

}

h1{

    text-align:center;
    color:white;
    margin-bottom:8px;
    font-size:30px;

}

.subtitle{

    text-align:center;
    color:#E5E7EB;
    margin-bottom:30px;
    font-size:14px;

}

.group{

    margin-bottom:18px;

}

label{

    color:white;
    display:block;
    margin-bottom:7px;
    font-weight:500;

}

input{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:.3s;

}

input:focus{

    transform:scale(1.02);
    box-shadow:0 0 12px rgba(255,255,255,.6);

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#FACC15;
    color:#111827;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    transform:translateY(-3px);
    background:#FDE047;

}

button:active{

    transform:scale(.97);

}

#result{

    margin-top:20px;
    text-align:center;
    font-weight:600;
    color:#ffffff;

}

.footer{

    text-align:center;
    margin-top:22px;
    color:white;
    font-size:13px;

}

</style>

</head>

<body>

<div class="container">

<h1>👨‍💼 Employee Portal</h1>

<p class="subtitle">
✨ Register New Team Member ✨
</p>

<form id="employeeForm">

<div class="group">

<label>🧑 Full Name</label>

<input
type="text"
id="name"
placeholder="🌟 Enter your full name"
required>

</div>

<div class="group">

<label>📧 Email Address</label>

<input
type="email"
id="email"
placeholder="📩 john@example.com"
required>

</div>

<div class="group">

<label>💼 Designation</label>

<input
type="text"
id="designation"
placeholder="🚀 Software Engineer"
required>

</div>

<button type="submit">
✨ Register Employee 🚀
</button>

</form>

<div id="result"></div>

<div class="footer">

💙 Welcome to Our Company 💙<br>

━━━━━━━━━━━━━━━━━━━━━━<br>

★ Together We Build ★

</div>

</div>

<script>

document.getElementById("employeeForm").addEventListener("submit",async function(e){

e.preventDefault();

const button=document.querySelector("button");

button.disabled=true;
button.innerHTML="⏳ Registering...";

const employee={

name:document.getElementById("name").value,
email:document.getElementById("email").value,
designation:document.getElementById("designation").value

};

try{

const response=await fetch("/api",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(employee)

});

const message=await response.text();

document.getElementById("result").style.color="#BBF7D0";
document.getElementById("result").innerHTML="✅ "+message+" 🎉";

document.getElementById("employeeForm").reset();

}
catch{

document.getElementById("result").style.color="#FECACA";
document.getElementById("result").innerHTML="❌ Registration Failed! Please try again.";

}

finally{

button.disabled=false;
button.innerHTML="✨ Register Employee 🚀";

}

});

</script>

</body>
</html>
