<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Registration Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Outfit',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(-45deg,#0F172A,#312E81,#2563EB,#06B6D4);
background-size:400% 400%;
animation:bg 12s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.card{

width:430px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

border-radius:22px;

padding:35px;

box-shadow:0 20px 45px rgba(0,0,0,.25);

animation:popup .8s ease;

}

@keyframes popup{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.logo{

font-size:55px;
text-align:center;

}

h1{

text-align:center;
color:white;
font-size:30px;
margin-top:10px;

}

.subtitle{

text-align:center;
color:#E2E8F0;
margin:10px 0 30px;

}

.inputBox{

position:relative;
margin-bottom:28px;

}

.inputBox input{

width:100%;
padding:16px 14px;

background:rgba(255,255,255,.15);

border:none;

border-radius:12px;

color:white;

font-size:15px;

outline:none;

transition:.3s;

}

.inputBox label{

position:absolute;

left:15px;
top:16px;

color:#CBD5E1;

pointer-events:none;

transition:.3s;

}

.inputBox input:focus,
.inputBox input:valid{

background:rgba(255,255,255,.2);

}

.inputBox input:focus+label,
.inputBox input:valid+label{

top:-11px;
left:12px;

background:#2563EB;

padding:2px 8px;

border-radius:20px;

font-size:12px;

color:white;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:14px;

background:linear-gradient(90deg,#6366F1,#3B82F6);

color:white;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.35s;

}

button:hover{

transform:translateY(-3px);

box-shadow:0 15px 30px rgba(59,130,246,.45);

}

button:active{

transform:scale(.98);

}

#result{

margin-top:22px;

text-align:center;

font-weight:600;

color:white;

}

.divider{

margin:30px 0;

text-align:center;

color:#E2E8F0;

font-size:13px;

}

.footer{

text-align:center;

color:#CBD5E1;

font-size:13px;

line-height:24px;

}

.footer span{

color:white;

font-weight:600;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">💼</div>

<h1>Employee Portal</h1>

<p class="subtitle">
✨ Join Our Amazing Team ✨
</p>

<form id="employeeForm">

<div class="inputBox">

<input
type="text"
id="name"
required>

<label>👤 Full Name</label>

</div>

<div class="inputBox">

<input
type="email"
id="email"
required>

<label>📧 Work Email</label>

</div>

<div class="inputBox">

<input
type="text"
id="designation"
required>

<label>💻 Designation</label>

</div>

<button type="submit">

🚀 Register Employee

</button>

</form>

<div id="result"></div>

<div class="divider">

━━━━━━━━━━━━━━━━━━━━━━━━

</div>

<div class="footer">

⭐ Excellence Begins Here ⭐

<br><br>

Made with ❤️ using HTML • CSS • JavaScript

<br>

© 2026 Employee Registration Portal

</div>

</div>

<script>

document.getElementById("employeeForm").addEventListener("submit",async function(e){

e.preventDefault();

const btn=document.querySelector("button");

btn.disabled=true;

btn.innerHTML="⏳ Registering...";

const employee={

name:document.getElementById("name").value,

email:document.getElementById("email").value,

designation:document.getElementById("designation").value

};

try{

const response=await fetch("/api",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(employee)

});

const message=await response.text();

document.getElementById("result").style.color="#BBF7D0";

document.getElementById("result").innerHTML="✅ "+message+" 🎉";

document.getElementById("employeeForm").reset();

}

catch(error){

document.getElementById("result").style.color="#FECACA";

document.getElementById("result").innerHTML="❌ Unable to register employee. Please try again.";

}

finally{

btn.disabled=false;

btn.innerHTML="🚀 Register Employee";

}

});

</script>

</body>
</html>
