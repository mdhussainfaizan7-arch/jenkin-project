<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--bg:#0d1117;
--card:#161b22;
--border:#30363d;
--text:#f0f6fc;
--muted:#8b949e;
--primary:#238636;
--primaryHover:#2ea043;
--input:#21262d;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif;
}

body{

background:var(--bg);

display:flex;
justify-content:center;
align-items:center;

height:100vh;

color:var(--text);

}

.container{

width:430px;

background:var(--card);

border:1px solid var(--border);

border-radius:12px;

padding:32px;

box-shadow:0 12px 32px rgba(0,0,0,.35);

}

h1{

font-size:26px;

font-weight:700;

margin-bottom:6px;

}

.subtitle{

color:var(--muted);

font-size:14px;

margin-bottom:28px;

}

.form-group{

margin-bottom:20px;

}

label{

display:block;

font-size:14px;

margin-bottom:8px;

font-weight:500;

}

input{

width:100%;

padding:13px;

background:var(--input);

border:1px solid var(--border);

border-radius:8px;

color:white;

font-size:15px;

transition:.25s;

}

input::placeholder{

color:var(--muted);

}

input:focus{

outline:none;

border-color:var(--primary);

}

button{

width:100%;

padding:14px;

background:var(--primary);

border:none;

border-radius:8px;

color:white;

font-size:15px;

font-weight:600;

cursor:pointer;

transition:.25s;

}

button:hover{

background:var(--primaryHover);

}

#result{

margin-top:18px;

font-size:14px;

text-align:center;

font-weight:500;

}

.footer{

margin-top:28px;

text-align:center;

font-size:13px;

color:var(--muted);

border-top:1px solid var(--border);

padding-top:18px;

}

</style>

</head>

<body>

<div class="container">

<h1>Employee Registration</h1>

<p class="subtitle">
Register a new employee into the system.
</p>

<form id="employeeForm">

<div class="form-group">

<label for="name">Full Name</label>

<input
type="text"
id="name"
placeholder="John Doe"
required>

</div>

<div class="form-group">

<label for="email">Email Address</label>

<input
type="email"
id="email"
placeholder="john@example.com"
required>

</div>

<div class="form-group">

<label for="designation">Designation</label>

<input
type="text"
id="designation"
placeholder="Software Engineer"
required>

</div>

<button type="submit">

Register Employee

</button>

</form>

<div id="result"></div>

<div class="footer">

Employee Management Portal • Version 1.0

</div>

</div>

<script>

const form=document.getElementById("employeeForm");

const result=document.getElementById("result");

const button=document.querySelector("button");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

button.disabled=true;

button.innerText="Submitting...";

const employee={

name:document.getElementById("name").value,
email:document.getElementById("email").value,
designation:document.getElementById("designation").value

};

try{

const response=await fetch("/api",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(employee)

});

const message=await response.text();

result.style.color="#3fb950";

result.innerText=message;

form.reset();

}
catch{

result.style.color="#f85149";

result.innerText="Registration failed.";

}

finally{

button.disabled=false;

button.innerText="Register Employee";

}

});

</script>

</body>
</html>
