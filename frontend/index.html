<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#eef4ff,#d9ecff);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card{
            width:420px;
            background:#ffffff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#1e3a8a;
        }

        .input-box{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:7px;
            font-size:14px;
            font-weight:500;
            color:#444;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            font-size:15px;
            transition:.3s;
        }

        input:focus{
            border-color:#2563eb;
            outline:none;
            box-shadow:0 0 5px rgba(37,99,235,.3);
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        button:active{
            transform:scale(.98);
        }

        #result{
            margin-top:20px;
            text-align:center;
            font-weight:500;
            color:green;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Employee Registration</h2>

    <form id="employeeForm">

        <div class="input-box">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter full name"
                required>
        </div>

        <div class="input-box">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required>
        </div>

        <div class="input-box">
            <label for="designation">Job Role</label>
            <input
                type="text"
                id="designation"
                placeholder="Frontend Developer"
                required>
        </div>

        <button type="submit">Register Employee</button>

    </form>

    <p id="result"></p>

</div>

<script>

document.getElementById("employeeForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const btn = document.querySelector("button");

    btn.disabled = true;
    btn.innerText = "Please Wait...";

    const employee = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        designation: document.getElementById("designation").value
    };

    try{

        const response = await fetch("/api",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(employee)
        });

        const message = await response.text();

        document.getElementById("result").style.color="green";
        document.getElementById("result").innerText=message;

        document.getElementById("employeeForm").reset();

    }
    catch(error){

        document.getElementById("result").style.color="red";
        document.getElementById("result").innerText="Unable to register employee.";

    }
    finally{

        btn.disabled=false;
        btn.innerText="Register Employee";

    }

});

</script>

</body>
</html>
